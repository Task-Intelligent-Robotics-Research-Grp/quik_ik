quik_ik:
  max_iterations: {
    type:          int,
    default_value: 200,
    description:   "Maximum number of iterations of the algorithm.",
    validation: {
      gt<>: [0],
    }
  }
  algorithm: {
    type:          string,
    default_value: "ALGORITHM_QUIK",
    description:   "The algorithm to use.",
    validation: {
      one_of<>: [["ALGORITHM_QUIK", "ALGORITHM_NR", "ALGORITHM_BFGS"]],
    }
  }
  exit_tolerance: {
    type:          double,
    default_value: 1.0e-12,
    description:   "The exit tolerance on the norm of the error.",
    validation: {
      gt_eq<>: [1.0e-64],
    }
  }
  minimum_step_size: {
    type:          double,
    default_value: 1.0e-14,
    description:   "The minimum joint angle step size(normed) before the solver exits.",
    validation: {
      gt_eq<>: [1.0e-64],
    }
  }
  relative_improvement_tolerance: {
    type:          double,
    default_value: 0.05,
    description:   "The minimum relative iteration-to-iteration improvement. If this threshold isn't met, a counter is incremented. If the threshold isn't met [max_consecutive_grad_fails] times in a row, then the algorithm exits. For example, 0.05 represents a minimum of 5% relative improvement.",
    validation: {
      gt<>: [0.0],
    }
  }
  max_consecutive_grad_fails: {
    type:          int,
    default_value: 5,
    description:   "The maximum number of relative improvement fails before the algorithm exits.",
    validation: {
      gt<>: [0],
    }
  }
  max_gradient_fails: {
    type:          int,
    default_value: 20,
    description:   "The maximum number of fails before the algorithm exits.",
    validation: {
      gt<>: [0],
    }
  }
  lambda_squared: {
    type:          double,
    default_value: 0.0,
    description:   "The square of the damping factor, lambda. Only applies to the NR and QuIK methods. If given, these methods become the DNR (also known as levenberg-marquardt) or the DQuIK algorithm. Ignored for BFGS algorithm.",
    validation: {
      gt_eq<>: [0.0],
    }
  }
  max_linear_step_size: {
    type:          double,
    default_value: 0.34,
    description:   "An upper limit of the error step in a single step. Ignored for BFGS algorithm.",
    validation: {
      gt<>: [0.0],
    }
  }
  max_angular_step_size: {
    type:          double,
    default_value: 1.0,
    description:   "An upper limit of the error step in a single step. Ignored for BFGS algorithm.",
    validation: {
      gt<>: [0.0],
    }
  }
  armijo_sigma: {
    type:          double,
    default_value: 1.0e-5,
    description:   "The sigma value used in armijo's rule, for line search in the BFGS method",
    validation: {
      gt<>: [0.0],
    }
  }
  armijo_beta: {
    type:          double,
    default_value: 0.5,
    description:   "The sigma value used in armijo's rule, for line search in the BFGS method",
    validation: {
      gt<>: [0.0],
    }
  }
