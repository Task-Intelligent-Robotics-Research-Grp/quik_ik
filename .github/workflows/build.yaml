name: ROS build workflow

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      ros_distro:
        required: true
        type: string

jobs:
  ros_build:
    runs-on: ${{ inputs.os }}
    env:
      WS:  /home/runner/work/ros2_ws
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        path: quik_ik

    - name: Setup ROS
      uses: ros-tooling/setup-ros@v0.7
      with:
        required-ros-distributions: ${{ inputs.ros_distro }}

    - name: Apt update and upgrade
      run: |
        sudo apt update
        sudo apt upgrade -y

    - name: Install dependencies
      run: |
        sudo apt install libncurses-dev libgsl-dev libconfig++-dev nlohmann-json3-dev python3-rosdoc2 python3-doxypypy

    - name: Checkout dependencies
      run: |
        vcs import . --input=quik_ik/dependencies.repos

    - name: Patch libconfig
      run: |
        cd ${{github.workspace}}/quik
	patch < ${{github.workspace}}/quik_ik/quik.patch

    - name: Init workspace
      run: |
        mkdir ${WS}
        ln -s ${GITHUB_WORKSPACE} ${WS}/src

    - name: Pre build
      run: |
        source /opt/ros/${{ inputs.ros_distro }}/setup.bash
        cd ${WS}/src
        rosdep update
        rosdep install -iy --from-paths ./

    - name: Build
      run: |
        source /opt/ros/${{ inputs.ros_distro }}/setup.bash
        cd ${WS}
        colcon build --symlink-install --cmake-args -DCMAKE_BUILD_TYPE=Release
